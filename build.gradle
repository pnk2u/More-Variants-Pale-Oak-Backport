plugins {
	id 'fabric-loom' // version from versions.gradle via settings.gradle's pluginManagement
	id 'maven-publish'
}

apply from: "versions.gradle"

def mc_version_name() {
	def named = project.findProperty('minecraft_version_name')
	return named ? named : project.minecraft_version
}

version = "${mod_version}+${mc_version_name()}-Fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		name = 'Modrinth'
		url = "https://api.modrinth.com/maven"
	}
	maven { url = "https://maven.bawnorton.com/releases" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.shedaniel.me/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		project.properties.get("mod_id") {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	//configureDataGeneration()
}

def releaseVersion = getReleaseVersion(minecraft_version)
def (fabric_loader_version, fabric_loader_version_0, fabric_api_version) = latestFabric(releaseVersion)
def (pMinecraftVersion, mostRecentParchmentDate) = latestParchment(releaseVersion)

dependencies {
	implementation 'org.apache.commons:commons-text:1.12.0'
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${pMinecraftVersion}:${mostRecentParchmentDate}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// More Variants Core
	modCompileOnly modLocalRuntime("maven.modrinth:more-variants-core:${project.m_v_core_version_id}")
}

def minecraft_version_0 = lowerMinecraftVersion(minecraft_version_lower)
def minecraft_version_1 = upperMinecraftVersion(minecraft_version_upper)
def (java_version, java_version_enum) = javaVersions(releaseVersion)

def replaceProperties = [
		mod_id: mod_id, mod_name: mod_name, mod_description: mod_description, mod_license: mod_license,
		mod_version: mod_version, more_variants_core_version: m_v_core_version,
		min_floader_version: fabric_loader_version_0,
		minecraft_version_0: minecraft_version_0, minecraft_version_1: minecraft_version_1, java_version: java_version
]
println "===\nExpanding the following values into fabric.mod.json and *.mixins.json:\n${replaceProperties.collect { k, v -> "  ${k}: ${v}" }.join('\n')}\n==="

["processResources", "processClientResources"].each { taskName ->
	tasks.named(taskName) {
		inputs.properties replaceProperties
		["fabric.mod.json", "*.mixins.json"].each { pattern ->
			filesMatching(pattern) {
				expand replaceProperties
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = java_version
}

java {
	sourceCompatibility = java_version_enum
	targetCompatibility = java_version_enum
}

jar {
	from("LICENSE") {
		rename { "${project.base.archivesName.get()}_${it}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}